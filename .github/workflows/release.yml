# A pushed tag filesviewhub-<version>-build-<n> makes a GitHub Release: its notes are the annotated
# tag's message (scripts/release-note.mjs makes it), and it carries the Windows zip, the Linux
# AppImage and the macOS disk images (Apple Silicon and Intel), each built by `npm run package`
# after the gate passes on that system, and FFmpeg's source with its build scripts. The build runs
# with a read-only token; only the last job, which runs no project code, can write the release.
# Run by hand (`gh workflow run release.yml`), it makes the packages as the run's artifacts only,
# with no release and no Intel Mac image.
name: release
on:
  push:
    tags: ['filesviewhub-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release, notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --notes-from-tag --title "$TAG" --draft
  package:
    needs: release
    # Run by hand there is no release job, and the packages are still made.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      # One failed package does not stop the others, so a rerun of the failed one is enough.
      fail-fast: false
      matrix:
        # The Intel Mac (about 30 minutes, which count ten times) only for a tagged release.
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest","ubuntu-24.04","macos-latest","macos-15-intel"]') || fromJSON('["windows-latest","ubuntu-24.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils djvulibre-bin
      - run: npm ci --no-audit --no-fund
      - run: npm run fetch-tools
      - run: node scripts/check.mjs
      - name: Package
        id: package
        shell: bash
        run: |
          npm run package
          echo "file=$(ls release/FilesViewHub-*.zip release/FilesViewHub-*.AppImage release/FilesViewHub-*.dmg 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          # A hand run's packages are for a quick check only.
          retention-days: 7
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
  upload:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - name: FFmpeg's source and its build scripts, at the pinned commits
        # The packages ship FFmpeg (GPL 3 as a whole), so each release carries its source: FFmpeg at
        # FFMPEG_COMMIT and BtbN's FFmpeg-Builds at BUILDS_COMMIT, whose scripts pin each library.
        shell: bash
        run: |
          pin() { sed -n "s/^const $1 = '\([0-9a-f]\{40\}\)'$/\1/p" repo/scripts/fetch-tools.mjs; }
          ff=$(pin FFMPEG_COMMIT); builds=$(pin BUILDS_COMMIT)
          test -n "$ff" && test -n "$builds"
          curl -fsSL -o "packages/ffmpeg-source-$ff.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/$ff.tar.gz"
          # The macOS build is made from this file, pinned in fetch-tools.mjs; the release ships the same bytes.
          sum=$(sed -n "/file: \`ffmpeg-\${FFMPEG_COMMIT}.tar.gz\`/{n;s/^ *sha256: '\([0-9a-f]\{64\}\)'.*/\1/p}" repo/scripts/fetch-tools.mjs)
          test -n "$sum" && echo "$sum  packages/ffmpeg-source-$ff.tar.gz" | sha256sum -c -
          curl -fsSL -o "packages/ffmpeg-builds-scripts-$builds.tar.gz" "https://github.com/BtbN/FFmpeg-Builds/archive/$builds.tar.gz"
      - name: Checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" packages/*
